<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Nova — Tasks</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>NOVA</div>
    <form id="ask"><input id="ask-in" placeholder="Ask Nova or give her a task…" autocomplete="off"><button>Send</button></form>
    <button id="stop" class="stop" title="Stop everything (Ctrl+Alt+X)">■ Stop</button>
  </header>
  <nav id="tabs">
    <button data-tab="tasks">Tasks <span id="inbox-n" class="n hidden"></span></button>
    <button data-tab="jobs">Jobs</button>
    <button data-tab="routines">Routines</button>
    <button data-tab="projects">Projects</button>
    <button data-tab="refs">References</button>
    <button data-tab="phone">Phone</button>
    <button data-tab="memory">Memory</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="capability">What works</button>
    <button data-tab="diagnostics">Diagnostics</button>
  </nav>
  <main id="view"></main>
  <script src="panel.js"></script>
</body>
</html>
