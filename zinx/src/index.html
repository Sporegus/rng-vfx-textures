<!doctype html>
<html>
<head>

  <title>Zinx</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="zinx"><canvas id="sprite"></canvas></div>

  </div>

  <script src="renderer.js"></script>
